# ============================================================
# NAV2 CONFIGURATION
# Differential-drive autonomous indoor delivery robot
#
# Robot footprint: 0.24 m x 0.125 m
# Filtered odometry: /odometry/filtered
# LiDAR: /scan
# Ultrasonic: /ultrasonic
#
# Ultrasonic sensor:
#   frame: ultrasonic_link
#   x: 0.120 m
#   y: 0.060 m
#   z: 0.086 m
#
# IMPORTANT:
# ultrasonic_link must have a TF to base_link.
# ============================================================


# ============================================================
# PLANNER SERVER
# ============================================================

planner_server:
  ros__parameters:

    use_sim_time: false

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      tolerance: 0.15

      use_astar: false

      allow_unknown: false


# ============================================================
# CONTROLLER SERVER
# ============================================================

controller_server:
  ros__parameters:

    use_sim_time: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001

    min_y_velocity_threshold: 0.001

    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3


    # --------------------------------------------------------
    # Progress checker
    # --------------------------------------------------------

    progress_checker_plugins:
      ["progress_checker"]


    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.05

      movement_time_allowance: 8.0


    # --------------------------------------------------------
    # Goal checker
    # --------------------------------------------------------

    goal_checker_plugins:
      ["goal_checker"]


    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      stateful: true

      xy_goal_tolerance: 0.05

      yaw_goal_tolerance: 0.08


    # --------------------------------------------------------
    # Controller
    # --------------------------------------------------------

    controller_plugins:
      ["FollowPath"]


    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"


      # Velocity limits

      min_vel_x: 0.0

      max_vel_x: 0.18

      min_vel_y: 0.0

      max_vel_y: 0.0

      max_vel_theta: 1.0


      min_speed_xy: 0.0

      max_speed_xy: 0.15

      min_speed_theta: 0.0


      # Acceleration limits

      acc_lim_x: 0.35

      decel_lim_x: -0.35

      acc_lim_theta: 1.0

      decel_lim_theta: -1.0


      # Sampling

      vx_samples: 8

      vtheta_samples: 15


      # Simulation

      sim_time: 1.0

      linear_granularity: 0.025

      angular_granularity: 0.025

      transform_tolerance: 0.2


      # Goal

      xy_goal_tolerance: 0.05

      trans_stopped_velocity: 0.02


      short_circuit_trajectory_evaluation: true

      stateful: true


      # ------------------------------------------------------
      # DWB critics
      # ------------------------------------------------------

      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist"
        ]


      BaseObstacle.scale: 0.02


      PathAlign.scale: 16.0

      PathAlign.forward_point_distance: 0.10


      GoalAlign.scale: 5.0

      GoalAlign.forward_point_distance: 0.10


      PathDist.scale: 12.0


      GoalDist.scale: 10.0


      RotateToGoal.scale: 2.0

      RotateToGoal.slowing_factor: 5.0

      RotateToGoal.lookahead_time: -1.0


# ============================================================
# LOCAL COSTMAP
# ============================================================
#
# IMPORTANT CHANGE:
#
# Added:
#
#   nav2_costmap_2d::RangeSensorLayer
#
# This allows the ultrasonic sensor to contribute obstacle
# information to the local costmap.
#
# LiDAR remains active through obstacle_layer.
# ============================================================

local_costmap:

  local_costmap:

    ros__parameters:

      use_sim_time: false


      # ------------------------------------------------------
      # Update rates
      # ------------------------------------------------------

      update_frequency: 10.0

      publish_frequency: 5.0


      # ------------------------------------------------------
      # Frames
      # ------------------------------------------------------

      global_frame: odom

      robot_base_frame: base_link
      transform_tolerance: 1.0

      # ------------------------------------------------------
      # Rolling local window
      # ------------------------------------------------------

      rolling_window: true

      width: 2

      height: 2

      resolution: 0.03


      # ------------------------------------------------------
      # Robot geometry
      # ------------------------------------------------------

      robot_radius: 0.0

      footprint: "[[0.075, 0.06],
                   [0.075, -0.06],
                   [-0.075, -0.06],
                   [-0.075, 0.06]]"

      footprint_padding: 0.01


      # ------------------------------------------------------
      # COSTMAP PLUGINS
      # ------------------------------------------------------
      #
      # obstacle_layer = LiDAR
      # range_layer   = Ultrasonic
      # inflation     = safety buffer
      #

      plugins:
        [
          "obstacle_layer",
          "range_layer",
          "inflation_layer"
        ]


      # ======================================================
      # LIDAR OBSTACLE LAYER
      # ======================================================

      obstacle_layer:

        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true


        observation_sources: scan


        scan:

          topic: /scan

          data_type: LaserScan

          marking: true

          clearing: true


          obstacle_max_range: 10.0

          raytrace_max_range: 10.0


          obstacle_min_range: 0.15

          raytrace_min_range: 0.10


          max_obstacle_height: 0.8

          min_obstacle_height: 0.0


      # ======================================================
      # ULTRASONIC RANGE SENSOR LAYER
      # ======================================================
      #
      # Receives:
      
      #   /ultrasonic
      
      # Message type:
      
      #   sensor_msgs/Range
      
      # Frame:
      
      #   ultrasonic_link
      
      # ======================================================

      range_layer:

        plugin: "nav2_costmap_2d::RangeSensorLayer"

        enabled: true


        # Ultrasonic topic

        topics:
          - /ultrasonic


        # Sensor cone angle

        phi: 1.2


        # Expand detection into a cone

        inflate_cone: 1.0


        # If no ultrasonic data arrives within this time,
        # the range layer considers the sensor inactive.

        no_readings_timeout: 0.5


        # Probability thresholds

        clear_threshold: 0.2

        mark_threshold: 0.8


        # Clear obstacle when maximum range is received

        clear_on_max_reading: true


        # Ultrasonic provides variable range readings

        input_sensor_type: "VARIABLE"


      # ======================================================
      # INFLATION LAYER
      # ======================================================

      inflation_layer:

        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 4.0

        inflation_radius: 0.15


      # ------------------------------------------------------
      # Costmap publishing
      # ------------------------------------------------------

      always_send_full_costmap: true


# ============================================================
# GLOBAL COSTMAP
# ============================================================
#
# IMPORTANT:
# Ultrasonic is NOT added here yet.
#
# We first test ultrasonic obstacle avoidance using the local
# costmap. This prevents unnecessary changes to your existing
# working global navigation configuration.
# ============================================================

global_costmap:

  global_costmap:

    ros__parameters:

      use_sim_time: false


      # ------------------------------------------------------
      # Update rates
      # ------------------------------------------------------

      update_frequency: 3.0

      publish_frequency: 2.0


      # ------------------------------------------------------
      # Frames
      # ------------------------------------------------------

      global_frame: map

      robot_base_frame: base_link
      transform_tolerance: 1.0

      # ------------------------------------------------------
      # Resolution
      # ------------------------------------------------------

      resolution: 0.05


      # ------------------------------------------------------
      # Unknown space
      # ------------------------------------------------------

      track_unknown_space: true


      # ------------------------------------------------------
      # Robot geometry
      # ------------------------------------------------------

      robot_radius: 0.0

      footprint: "[[0.075, 0.06],
                   [0.075, -0.06],
                   [-0.075, -0.06],
                   [-0.075, 0.06]]"

      footprint_padding: 0.01


      # ------------------------------------------------------
      # Plugins
      # ------------------------------------------------------

      plugins:
        [
          "static_layer",
          "obstacle_layer",
          "inflation_layer"
        ]


      # ======================================================
      # STATIC MAP
      # ======================================================

      static_layer:

        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true


      # ======================================================
      # LIDAR OBSTACLE LAYER
      # ======================================================

      obstacle_layer:

        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true


        observation_sources: scan


        scan:

          topic: /scan

          data_type: LaserScan

          marking: true

          clearing: true


          obstacle_max_range: 8.0

          raytrace_max_range: 6.0


          obstacle_min_range: 0.15

          raytrace_min_range: 0.10


          max_obstacle_height: 0.8

          min_obstacle_height: 0.0


      # ======================================================
      # INFLATION
      # ======================================================

      inflation_layer:

        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 4.0

        inflation_radius: 0.15


      # ------------------------------------------------------
      # Costmap publishing
      # ------------------------------------------------------

      always_send_full_costmap: true


# ============================================================
# BT NAVIGATOR
# ============================================================

bt_navigator:

  ros__parameters:

    use_sim_time: false

    global_frame: map

    robot_base_frame: base_link

    odom_topic: /odometry/filtered


    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"


    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"


# ============================================================
# BEHAVIOR SERVER
# ============================================================

behavior_server:

  ros__parameters:

    use_sim_time: false

    global_frame: odom

    robot_base_frame: base_link

    cycle_frequency: 10.0


    behavior_plugins:
      [
        "spin",
        "backup",
        "wait"
      ]


    spin:

      plugin: "nav2_behaviors::Spin"


    backup:

      plugin: "nav2_behaviors::BackUp"


    wait:

      plugin: "nav2_behaviors::Wait"


# ============================================================
# WAYPOINT FOLLOWER
# ============================================================

waypoint_follower:

  ros__parameters:

    use_sim_time: false

    loop_rate: 20

    stop_on_failure: false


# ============================================================
# VELOCITY SMOOTHER
# ============================================================

velocity_smoother:

  ros__parameters:

    use_sim_time: false

    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: "OPEN_LOOP"


    # --------------------------------------------------------
    # Velocity limits
    # --------------------------------------------------------

    max_velocity:
      [0.15, 0.0, 0.8]

    min_velocity:
      [-0.15, 0.0, -0.8]


    # --------------------------------------------------------
    # Acceleration
    # --------------------------------------------------------

    max_accel:
      [0.35, 0.0, 1.0]

    max_decel:
      [-0.35, 0.0, -1.0]


    # --------------------------------------------------------
    # Odometry
    # --------------------------------------------------------

    odom_topic: /odometry/filtered

    odom_duration: 0.1


    # --------------------------------------------------------
    # Command timeout
    # --------------------------------------------------------

    velocity_timeout: 1.0


    # Your Arduino bridge expects geometry_msgs/Twist,
    # not TwistStamped.

    enable_stamped_cmd_vel: false