ekf_filter_node:
  ros__parameters:

    frequency: 30.0
    sensor_timeout: 0.5

    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom


    # ==============================
    # ENCODER ODOMETRY
    # ==============================

    odom0: /wheel/odom

    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    odom0_queue_size: 20
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false