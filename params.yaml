slam_toolbox:
  ros__parameters:

    # =========================================================
    # SOLVER
    # =========================================================

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None


    # =========================================================
    # FRAMES / TOPICS
    # =========================================================

    odom_frame: odom
    map_frame: map
    base_frame: base_link

    scan_topic: /scan

    mode: mapping

    use_map_saver: true


    # =========================================================
    # MAP
    # =========================================================

    resolution: 0.05
    map_update_interval: 1.0


    # =========================================================
    # TF
    # =========================================================

    transform_publish_period: 0.05
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    restamp_tf: false


    # =========================================================
    # LIDAR
    # =========================================================

    throttle_scans: 1

    # Your /scan reports range_min ~= 0.15 m
    min_laser_range: 0.15

    # More than enough for your small room
    max_laser_range: 6.0


    # =========================================================
    # SCAN PROCESSING
    # =========================================================

    # Your RPLidar is around 6.7 Hz (~0.149 sec/scan)
    minimum_time_interval: 0.15

    # IMPORTANT:
    # Now enable scan matching.
    use_scan_matching: true

    use_scan_barycenter: true


    # =========================================================
    # MOVEMENT THRESHOLDS
    # =========================================================

    # Small room + slow robot:
    # process approximately every 5 cm
    minimum_travel_distance: 0.05

    # ~5.7 degrees
    minimum_travel_heading: 0.10

    check_min_dist_and_heading_precisely: true


    # =========================================================
    # SCAN BUFFER
    # =========================================================

    scan_buffer_size: 10

    scan_buffer_maximum_scan_distance: 3.0


    # =========================================================
    # LOCAL SCAN MATCHING
    # =========================================================

    link_match_minimum_response_fine: 0.10

    link_scan_maximum_distance: 1.5


    # =========================================================
    # LOOP CLOSURE
    # =========================================================

    # Keep OFF for first stability test.
    # We can enable it after local mapping works correctly.
    do_loop_closing: false


    # =========================================================
    # CORRELATION SEARCH
    # =========================================================

    correlation_search_space_dimension: 0.5

    correlation_search_space_resolution: 0.01

    correlation_search_space_smear_deviation: 0.1


    # =========================================================
    # SCAN MATCHER
    # =========================================================

    distance_variance_penalty: 0.5

    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349

    coarse_search_angle_offset: 0.349

    coarse_angle_resolution: 0.0349

    minimum_angle_penalty: 0.9

    minimum_distance_penalty: 0.5

    use_response_expansion: true


    # =========================================================
    # OCCUPANCY GRID
    # =========================================================

    min_pass_through: 2

    occupancy_threshold: 0.1


    # =========================================================
    # OTHER
    # =========================================================

    debug_logging: false

    enable_interactive_mode: false

    stack_size_to_use: 40000000